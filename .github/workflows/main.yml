name: CI/CD - API Biblioteca

# Se ejecuta en cada push o pull request a main.
# - Pull request: solo pruebas (CI).
# - Push a main: pruebas -> imagen en Docker Hub -> despliegue en AWS EC2 (CD).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Evita dos despliegues simultáneos: si llega otro push, se cancela el anterior
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: webapp
  CONTAINER_NAME: practica3-api

jobs:
  # ===================== 1) Integración continua =====================
  test:
    name: Pruebas y cobertura
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Jest falla si la cobertura baja del 70% (coverageThreshold en package.json)
      - name: Ejecutar pruebas con cobertura
        run: npm run test:ci

      - name: Resumen de cobertura
        if: always()
        run: |
          node -e "
            const t = require('./coverage/coverage-summary.json').total;
            const filas = ['statements','branches','functions','lines']
              .map(k => '| ' + k + ' | ' + t[k].pct + '% | ' + t[k].covered + '/' + t[k].total + ' |');
            const md = ['## Cobertura de código', '', '| Métrica | % | Cubierto |', '|---|---|---|', ...filas].join('\n');
            console.log(md);
            require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, md + '\n');
          "

      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ===================== 2) Imagen en Docker Hub =====================
  build-and-push:
    name: Construir y publicar imagen
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Autenticación con Personal Access Token (nunca con la contraseña)
      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar (:latest y :sha)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===================== 3) Despliegue continuo en EC2 =====================
  deploy:
    name: Desplegar en AWS EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Actualizar el contenedor en EC2 por SSH
        uses: appleboy/ssh-action@v1
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,IMAGE_NAME,CONTAINER_NAME
          script: |
            set -e
            IMAGE="$DOCKERHUB_USERNAME/$IMAGE_NAME:latest"

            # 1) Descargar la versión más reciente ANTES de detener la actual (menos tiempo fuera de línea)
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            docker pull "$IMAGE"
            docker logout

            # 2) Detener y eliminar el contenedor anterior
            docker stop "$CONTAINER_NAME" 2>/dev/null || true
            docker rm "$CONTAINER_NAME" 2>/dev/null || true

            # 3) Levantar la nueva versión en el puerto 80 (los datos viven en volúmenes y no se pierden)
            docker run -d --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              -p 80:3000 \
              -v practica3-data:/app/data \
              -v practica3-backups:/app/backups \
              "$IMAGE"

            # 4) Verificar que la nueva versión responde en el puerto 80
            for i in $(seq 1 20); do
              if curl -fs http://localhost/api/categorias > /dev/null; then
                echo "Despliegue correcto: la API responde en el puerto 80"
                docker image prune -f
                exit 0
              fi
              sleep 3
            done
            echo "La nueva versión no respondió a tiempo"
            docker logs --tail 50 "$CONTAINER_NAME"
            exit 1
